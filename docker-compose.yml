version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - STORAGE_ROOT=/app/storage
    volumes:
      - studio_storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - STORAGE_ROOT=/app/storage
      - NODE_OPTIONS=--max-old-space-size=2048
    volumes:
      - studio_storage:/app/storage
    # Resource isolation for untrusted-code rendering
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  studio_storage:
